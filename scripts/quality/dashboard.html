<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CET46 质量监控仪表盘</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #1a1a2e;
      --card: #16213e;
      --card-hover: #1a2745;
      --accent: #e94560;
      --accent-light: #ff6b81;
      --text: #e0e0e0;
      --text-dim: #8892a4;
      --border: #2a3a5c;
      --green: #4caf50;
      --blue: #42a5f5;
      --yellow: #ffc107;
      --orange: #ff9800;
      --red: #f44336;
      --purple: #ab47bc;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }
    .container { max-width: 1280px; margin: 0 auto; padding: 16px; }

    /* Header */
    .header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 24px; background: var(--card); border-radius: 12px;
      margin-bottom: 20px; border: 1px solid var(--border);
    }
    .header h1 { font-size: 1.5rem; font-weight: 700; color: #fff; }
    .header h1 span { color: var(--accent); }
    .header-meta { font-size: 0.875rem; color: var(--text-dim); text-align: right; }
    .header-meta .timestamp { color: var(--text); font-weight: 500; }

    /* Grid layouts */
    .top-grid {
      display: grid; grid-template-columns: 380px 1fr; gap: 20px; margin-bottom: 20px;
    }
    .dim-cards {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
      align-content: start;
    }
    .section { background: var(--card); border-radius: 12px; border: 1px solid var(--border); padding: 20px; }
    .section-title {
      font-size: 1rem; font-weight: 600; margin-bottom: 16px;
      padding-bottom: 8px; border-bottom: 1px solid var(--border); color: #fff;
    }

    /* Score overview */
    .score-overview { display: flex; align-items: center; gap: 24px; margin-bottom: 20px; }
    .score-big {
      width: 120px; height: 120px; border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      border: 4px solid var(--accent); flex-shrink: 0;
    }
    .score-big .num { font-size: 2rem; font-weight: 800; color: #fff; line-height: 1; }
    .score-big .label { font-size: 0.75rem; color: var(--text-dim); margin-top: 4px; }
    .score-info h2 { font-size: 1.25rem; color: #fff; margin-bottom: 4px; }
    .gate-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 20px; font-size: 0.875rem; font-weight: 600;
    }
    .gate-pass { background: rgba(76,175,80,0.15); color: var(--green); border: 1px solid rgba(76,175,80,0.3); }
    .gate-fail { background: rgba(244,67,54,0.15); color: var(--red); border: 1px solid rgba(244,67,54,0.3); }
    .gate-checks { margin-top: 10px; }
    .gate-check {
      display: inline-flex; align-items: center; gap: 4px;
      margin: 3px 6px 3px 0; font-size: 0.8rem; color: var(--text-dim);
    }
    .gate-check .icon { font-size: 0.75rem; }

    /* Dimension card */
    .dim-card {
      background: var(--bg); border-radius: 10px; padding: 14px; border: 1px solid var(--border);
      transition: border-color 0.2s;
    }
    .dim-card:hover { border-color: var(--accent); }
    .dim-card .dim-name { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 4px; }
    .dim-card .dim-score-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
    .dim-card .dim-score { font-size: 1.4rem; font-weight: 700; color: #fff; }
    .dim-card .dim-delta { font-size: 0.75rem; font-weight: 600; }
    .dim-card .dim-delta.up { color: var(--green); }
    .dim-card .dim-delta.down { color: var(--red); }
    .dim-card .dim-grade {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      font-size: 0.7rem; font-weight: 600; margin-bottom: 8px;
    }
    .dim-card .progress-bar {
      height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden;
    }
    .dim-card .progress-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; }

    /* Grade colors */
    .grade-excellent { background: rgba(76,175,80,0.15); color: var(--green); }
    .grade-good { background: rgba(66,165,245,0.15); color: var(--blue); }
    .grade-pass { background: rgba(255,193,7,0.15); color: var(--yellow); }
    .grade-needs-work { background: rgba(255,152,0,0.15); color: var(--orange); }
    .grade-fail { background: rgba(244,67,54,0.15); color: var(--red); }

    /* Chart sections */
    .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .chart-container { position: relative; width: 100%; }
    .chart-container canvas { max-height: 320px; }

    /* Findings */
    .findings-list { list-style: none; }
    .finding-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 12px; border-radius: 8px; margin-bottom: 8px;
      font-size: 0.875rem; border-left: 3px solid;
    }
    .finding-P0 { background: rgba(244,67,54,0.08); border-color: var(--red); }
    .finding-P1 { background: rgba(255,193,7,0.08); border-color: var(--yellow); }
    .finding-P2 { background: rgba(76,175,80,0.08); border-color: var(--green); }
    .finding-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 6px; }
    .finding-P0 .finding-dot { background: var(--red); }
    .finding-P1 .finding-dot { background: var(--yellow); }
    .finding-P2 .finding-dot { background: var(--green); }
    .finding-prio { font-size: 0.7rem; font-weight: 700; margin-right: 4px; }
    .finding-P0 .finding-prio { color: var(--red); }
    .finding-P1 .finding-prio { color: var(--yellow); }
    .finding-P2 .finding-prio { color: var(--green); }

    /* Table */
    .detail-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .detail-table th {
      text-align: left; padding: 10px 12px; color: var(--text-dim); font-weight: 600;
      border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    .detail-table td {
      padding: 9px 12px; border-bottom: 1px solid rgba(42,58,92,0.4);
    }
    .detail-table tr:hover td { background: rgba(233,69,96,0.04); }
    .status-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px;
    }

    /* Empty state */
    .empty-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 48px 20px; color: var(--text-dim); text-align: center;
    }
    .empty-state .icon { font-size: 2.5rem; margin-bottom: 12px; opacity: 0.4; }
    .empty-state p { font-size: 0.9rem; }
    .empty-state .hint { font-size: 0.8rem; margin-top: 6px; opacity: 0.6; }

    /* Responsive */
    @media (max-width: 960px) {
      .top-grid { grid-template-columns: 1fr; }
      .dim-cards { grid-template-columns: repeat(2, 1fr); }
      .chart-row { grid-template-columns: 1fr; }
    }
    @media (max-width: 600px) {
      .header { flex-direction: column; align-items: flex-start; gap: 8px; }
      .header-meta { text-align: left; }
      .dim-cards { grid-template-columns: 1fr; }
      .score-overview { flex-direction: column; text-align: center; }
      .detail-table { font-size: 0.7rem; }
      .detail-table th, .detail-table td { padding: 6px 8px; }
    }
  </style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <div class="header">
    <h1>CET46 <span>质量监控仪表盘</span></h1>
    <div class="header-meta">
      <div>评估时间: <span class="timestamp" id="timestamp">--</span></div>
      <div>数据源: quality-score.json</div>
    </div>
  </div>

  <!-- Top: Radar + Score Overview -->
  <div class="top-grid">
    <div class="section">
      <div class="section-title">六维雷达图</div>
      <div class="chart-container">
        <canvas id="radarChart"></canvas>
      </div>
    </div>
    <div>
      <div class="section" style="margin-bottom:16px">
        <div class="score-overview" id="scoreOverview"></div>
        <div class="gate-checks" id="gateChecks"></div>
      </div>
      <div class="dim-cards" id="dimCards"></div>
    </div>
  </div>

  <!-- Trend -->
  <div class="section" style="margin-bottom:20px">
    <div class="section-title">质量趋势（近10次评估）</div>
    <div class="chart-container">
      <canvas id="trendChart" style="max-height:280px"></canvas>
    </div>
    <div id="trendEmpty" style="display:none"></div>
  </div>

  <!-- Findings + Pie -->
  <div class="chart-row">
    <div class="section">
      <div class="section-title">关键发现</div>
      <ul class="findings-list" id="findingsList"></ul>
    </div>
    <div class="section">
      <div class="section-title">问题分布</div>
      <div class="chart-container">
        <canvas id="pieChart"></canvas>
      </div>
    </div>
  </div>

  <!-- Detail Table -->
  <div class="section">
    <div class="section-title">详细指标</div>
    <div style="overflow-x:auto">
      <table class="detail-table" id="detailTable">
        <thead>
          <tr>
            <th>维度</th><th>指标</th><th>当前值</th><th>基准值</th><th>得分</th><th>状态</th>
          </tr>
        </thead>
        <tbody id="detailBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
// ===== Dimension metadata =====
const DIM_META = {
  codeQuality:    { name: '代码质量', weight: 25 },
  completeness:   { name: '功能完整性', weight: 20 },
  performance:    { name: '性能表现', weight: 20 },
  security:       { name: '安全性', weight: 15 },
  userExperience: { name: '用户体验', weight: 12 },
  documentation:  { name: '文档完整性', weight: 8 }
};
const DIM_KEYS = Object.keys(DIM_META);

// ===== Grade helpers =====
function gradeInfo(score) {
  if (score >= 90) return { label: '优秀', cls: 'grade-excellent', color: '#4caf50' };
  if (score >= 75) return { label: '良好', cls: 'grade-good', color: '#42a5f5' };
  if (score >= 60) return { label: '合格', cls: 'grade-pass', color: '#ffc107' };
  if (score >= 40) return { label: '需改进', cls: 'grade-needs-work', color: '#ff9800' };
  return { label: '不合格', cls: 'grade-fail', color: '#f44336' };
}
function progressColor(score) {
  if (score >= 90) return '#4caf50';
  if (score >= 75) return '#42a5f5';
  if (score >= 60) return '#ffc107';
  if (score >= 40) return '#ff9800';
  return '#f44336';
}

// ===== Indicator definitions for detail table =====
const INDICATORS = {
  codeQuality: [
    { name: '测试覆盖率', key: 'avgCoverage', benchmark: 70, unit: '%', fmt: v => v != null ? v.toFixed(1) + '%' : '--' },
    { name: 'ESLint 错误密度', key: 'eslintErrorDensity', benchmark: 2, unit: '/KLOC', fmt: v => v != null ? v.toFixed(2) : '--' },
    { name: 'ESLint 警告密度', key: 'eslintWarningDensity', benchmark: 5, unit: '/KLOC', fmt: v => v != null ? v.toFixed(2) : '--' },
    { name: '代码总行数', key: 'totalLines', benchmark: null, unit: '', fmt: v => v != null ? v.toLocaleString() : '--' },
    { name: '函数数量', key: 'totalFunctions', benchmark: null, unit: '', fmt: v => v != null ? v : '--' },
    { name: '函数平均行数', key: 'functionAvgLines', benchmark: 30, unit: '', fmt: v => v != null ? v : '--' },
    { name: 'TypeScript strict', key: 'strictMode', benchmark: true, unit: '', fmt: v => v === true ? '已启用' : v === false ? '未启用' : '--' },
  ],
  completeness: [
    { name: '测试通过数', key: 'testsPassed', benchmark: null, unit: '', fmt: v => v != null ? v : '--' },
    { name: '测试失败数', key: 'testsFailed', benchmark: 0, unit: '', fmt: v => v != null ? v : '--' },
    { name: '测试总数', key: 'testsTotal', benchmark: null, unit: '', fmt: v => v != null ? v : '--' },
    { name: '测试通过率', key: 'testPassRate', benchmark: 90, unit: '%', fmt: v => v != null ? v.toFixed(1) + '%' : '--' },
    { name: '功能测试覆盖率', key: 'featureTestCoverage', benchmark: 60, unit: '%', fmt: v => v != null ? v.toFixed(1) + '%' : '--' },
    { name: 'SW 已注册', key: 'swRegistered', benchmark: true, unit: '', fmt: v => v === true ? '是' : v === false ? '否' : '--' },
  ],
  performance: [
    { name: 'Bundle 大小', key: 'bundleSizeKB', benchmark: 500, unit: 'KB', fmt: v => v != null ? v + ' KB' : '--' },
    { name: 'JS Bundle 大小', key: 'jsBundleSizeKB', benchmark: 400, unit: 'KB', fmt: v => v != null ? v + ' KB' : '--' },
    { name: 'Worker 数量', key: 'workerCount', benchmark: 3, unit: '', fmt: v => v != null ? v : '--' },
    { name: 'LRU 缓存', key: 'hasLRUCache', benchmark: true, unit: '', fmt: v => v === true ? '有' : v === false ? '无' : '--' },
    { name: '懒加载模式', key: 'lazyLoadPatterns', benchmark: 5, unit: '', fmt: v => v != null ? v : '--' },
  ],
  security: [
    { name: 'npm 审计漏洞', key: 'auditTotal', benchmark: 0, unit: '', fmt: v => v != null ? (v < 0 ? '未检测' : v) : '--' },
    { name: '高危漏洞', key: 'auditHigh', benchmark: 0, unit: '', fmt: v => v != null ? (v < 0 ? '未检测' : v) : '--' },
    { name: 'innerHTML 使用', key: 'innerHTMLCount', benchmark: 5, unit: '次', fmt: v => v != null ? v + ' 次' : '--' },
    { name: 'eval/Function', key: 'evalCount', benchmark: 0, unit: '次', fmt: v => v != null ? v + ' 次' : '--' },
    { name: 'CORS 已配置', key: 'corsConfigured', benchmark: true, unit: '', fmt: v => v === true ? '是' : v === false ? '否' : '--' },
    { name: '输入验证模式', key: 'inputValidationPatterns', benchmark: 10, unit: '', fmt: v => v != null ? v : '--' },
  ],
  userExperience: [
    { name: 'ARIA 属性数', key: 'ariaAttributeCount', benchmark: null, unit: '', fmt: v => v != null ? v : '--' },
    { name: 'ARIA 覆盖率', key: 'ariaCoverageRate', benchmark: 60, unit: '%', fmt: v => v != null ? v.toFixed(1) + '%' : '--' },
    { name: 'role 使用数', key: 'roleUsage', benchmark: null, unit: '', fmt: v => v != null ? v : '--' },
    { name: '暗色模式', key: 'hasDarkMode', benchmark: true, unit: '', fmt: v => v === true ? '支持' : v === false ? '不支持' : '--' },
    { name: '减弱动画', key: 'hasReducedMotion', benchmark: true, unit: '', fmt: v => v === true ? '支持' : v === false ? '不支持' : '--' },
    { name: '键盘快捷键', key: 'hasKeyboardShortcuts', benchmark: true, unit: '', fmt: v => v === true ? '有' : v === false ? '无' : '--' },
  ],
  documentation: [
    { name: '代码总行数', key: 'totalCodeLines', benchmark: null, unit: '', fmt: v => v != null ? v.toLocaleString() : '--' },
    { name: 'JSDoc 行数', key: 'jsdocLines', benchmark: null, unit: '', fmt: v => v != null ? v : '--' },
    { name: 'JSDoc 密度', key: 'jsdocDensity', benchmark: 10, unit: '%', fmt: v => v != null ? v.toFixed(2) + '%' : '--' },
    { name: 'CHANGELOG 条目', key: 'changelogEntries', benchmark: 5, unit: '', fmt: v => v != null ? v : '--' },
  ],
};

// ===== Data paths =====
const SCORE_URL = '../../reports/quality-score.json';
const HISTORY_DIR = '../../reports/quality-history/';

// ===== Fetch helpers =====
async function fetchJSON(url) {
  try {
    const res = await fetch(url);
    if (!res.ok) return null;
    return await res.json();
  } catch { return null; }
}

async function fetchHistory() {
  try {
    const idx = await fetchJSON(HISTORY_DIR + 'index.json');
    if (!idx || !Array.isArray(idx.files)) return [];
    const sorted = idx.files.sort();
    const recent = sorted.slice(-10);
    const results = [];
    for (const f of recent) {
      const d = await fetchJSON(HISTORY_DIR + f);
      if (d) results.push(d);
    }
    return results;
  } catch {
    return [];
  }
}

// ===== Render functions =====
function renderHeader(data) {
  document.getElementById('timestamp').textContent = data.timestamp || '--';
}

function renderScoreOverview(data) {
  const score = data.overallScore;
  const grade = gradeInfo(score);
  const el = document.getElementById('scoreOverview');
  el.innerHTML = `
    <div class="score-big" style="border-color:${grade.color}">
      <div class="num" style="color:${grade.color}">${score.toFixed(1)}</div>
      <div class="label">综合评分</div>
    </div>
    <div class="score-info">
      <h2>综合等级: <span style="color:${grade.color}">${grade.label}</span></h2>
      <div>
        <span class="gate-badge ${data.qualityGate.passed ? 'gate-pass' : 'gate-fail'}">
          ${data.qualityGate.passed ? '✅ 门禁通过' : '❌ 门禁未通过'}
        </span>
      </div>
    </div>
  `;
}

function renderGateChecks(data) {
  const el = document.getElementById('gateChecks');
  const checks = data.qualityGate.checks || [];
  el.innerHTML = checks.map(c => `
    <span class="gate-check">
      <span class="icon">${c.passed ? '✅' : '❌'}</span>
      ${c.name}: ${c.detail}
    </span>
  `).join('');
}

function renderDimCards(data, prevData) {
  const el = document.getElementById('dimCards');
  const ds = data.dimensionScores || {};
  const prevDs = prevData?.dimensionScores || {};
  let html = '';
  for (const key of DIM_KEYS) {
    const d = ds[key];
    if (!d) continue;
    const meta = DIM_META[key];
    const grade = gradeInfo(d.score);
    const prev = prevDs[key]?.score;
    let deltaHtml = '';
    if (prev != null) {
      const diff = d.score - prev;
      if (diff > 0) deltaHtml = `<span class="dim-delta up">▲${diff.toFixed(1)}</span>`;
      else if (diff < 0) deltaHtml = `<span class="dim-delta down">▼${Math.abs(diff).toFixed(1)}</span>`;
      else deltaHtml = `<span class="dim-delta" style="color:var(--text-dim)">—</span>`;
    }
    html += `
      <div class="dim-card">
        <div class="dim-name">${meta.name} (${meta.weight}%)</div>
        <div class="dim-score-row">
          <span class="dim-score" style="color:${grade.color}">${d.score.toFixed(1)}</span>
          ${deltaHtml}
        </div>
        <span class="dim-grade ${grade.cls}">${grade.label}</span>
        <div class="progress-bar">
          <div class="progress-fill" style="width:${d.score}%;background:${grade.color}"></div>
        </div>
      </div>
    `;
  }
  el.innerHTML = html;
}

function renderRadar(data) {
  const ds = data.dimensionScores || {};
  const labels = DIM_KEYS.map(k => DIM_META[k].name);
  const values = DIM_KEYS.map(k => ds[k]?.score ?? 0);
  const ctx = document.getElementById('radarChart').getContext('2d');
  new Chart(ctx, {
    type: 'radar',
    data: {
      labels,
      datasets: [{
        label: '当前评分',
        data: values,
        backgroundColor: 'rgba(233,69,96,0.15)',
        borderColor: '#e94560',
        borderWidth: 2,
        pointBackgroundColor: '#e94560',
        pointBorderColor: '#fff',
        pointBorderWidth: 1,
        pointRadius: 4,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      scales: {
        r: {
          beginAtZero: true, max: 100,
          ticks: { stepSize: 20, color: '#8892a4', backdropColor: 'transparent', font: { size: 10 } },
          grid: { color: 'rgba(255,255,255,0.06)' },
          angleLines: { color: 'rgba(255,255,255,0.06)' },
          pointLabels: { color: '#e0e0e0', font: { size: 12 } },
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#16213e', titleColor: '#fff', bodyColor: '#e0e0e0',
          borderColor: '#2a3a5c', borderWidth: 1,
        }
      }
    }
  });
}

function renderTrend(history, currentData) {
  const canvas = document.getElementById('trendChart');
  const emptyEl = document.getElementById('trendEmpty');
  const allPoints = [...history, currentData];
  if (allPoints.length < 2) {
    canvas.style.display = 'none';
    emptyEl.style.display = '';
    emptyEl.innerHTML = `
      <div class="empty-state">
        <div class="icon">📈</div>
        <p>暂无足够的历史数据</p>
        <div class="hint">需要至少 2 次评估记录才能展示趋势</div>
      </div>
    `;
    return;
  }
  const labels = allPoints.map(d => {
    const t = d.timestamp || '';
    return t.replace(/\s.*/, '').slice(-5) || '--';
  });
  const overall = allPoints.map(d => d.overallScore);
  const datasets = [{
    label: '综合分', data: overall,
    borderColor: '#e94560', backgroundColor: 'rgba(233,69,96,0.1)',
    borderWidth: 2, tension: 0.3, fill: true, pointRadius: 3,
  }];
  const dimColors = {
    codeQuality: '#4caf50', completeness: '#42a5f5', performance: '#ffc107',
    security: '#ab47bc', userExperience: '#ff9800', documentation: '#26c6da',
  };
  for (const key of DIM_KEYS) {
    datasets.push({
      label: DIM_META[key].name,
      data: allPoints.map(d => d.dimensionScores?.[key]?.score ?? null),
      borderColor: dimColors[key],
      borderWidth: 1.5, tension: 0.3, pointRadius: 2, borderDash: [4, 2],
    });
  }
  const ctx = canvas.getContext('2d');
  new Chart(ctx, {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: {
        x: { ticks: { color: '#8892a4', font: { size: 11 } }, grid: { color: 'rgba(255,255,255,0.04)' } },
        y: { beginAtZero: true, max: 100, ticks: { stepSize: 20, color: '#8892a4', font: { size: 11 } }, grid: { color: 'rgba(255,255,255,0.04)' } },
      },
      plugins: {
        legend: {
          position: 'bottom',
          labels: { color: '#e0e0e0', usePointStyle: true, pointStyle: 'circle', padding: 16, font: { size: 11 } },
        },
        tooltip: {
          backgroundColor: '#16213e', titleColor: '#fff', bodyColor: '#e0e0e0',
          borderColor: '#2a3a5c', borderWidth: 1,
        }
      },
      interaction: { mode: 'index', intersect: false },
    }
  });
}

function renderFindings(data) {
  const el = document.getElementById('findingsList');
  const findings = data.findings || [];
  if (findings.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="icon">🎉</div><p>未发现重大问题</p></div>';
    return;
  }
  const order = { P0: 0, P1: 1, P2: 2 };
  const sorted = [...findings].sort((a, b) => (order[a.priority] ?? 3) - (order[b.priority] ?? 3));
  el.innerHTML = sorted.map(f => `
    <li class="finding-item finding-${f.priority}">
      <span class="finding-dot"></span>
      <span><span class="finding-prio">[${f.priority}]</span>${f.message}</span>
    </li>
  `).join('');
}

function renderPie(data) {
  const ds = data.dimensionScores || {};
  const findings = data.findings || [];
  const dims = DIM_KEYS.map(k => DIM_META[k].name);
  const counts = DIM_KEYS.map(k => findings.filter(f => {
    const name = DIM_META[k].name;
    return f.message && f.message.includes(name);
  }).length);
  // If no dimension-specific match, distribute by priority
  const byPriority = { P0: 0, P1: 0, P2: 0 };
  for (const f of findings) {
    if (byPriority[f.priority] != null) byPriority[f.priority]++;
  }
  const prioLabels = ['P0 严重', 'P1 重要', 'P2 建议'];
  const prioValues = [byPriority.P0, byPriority.P1, byPriority.P2];
  const prioColors = ['#f44336', '#ffc107', '#4caf50'];
  const ctx = document.getElementById('pieChart').getContext('2d');
  new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: prioLabels,
      datasets: [{
        data: prioValues,
        backgroundColor: prioColors.map(c => c + '33'),
        borderColor: prioColors,
        borderWidth: 2,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: true,
      cutout: '55%',
      plugins: {
        legend: {
          position: 'bottom',
          labels: { color: '#e0e0e0', usePointStyle: true, pointStyle: 'circle', padding: 14, font: { size: 12 } },
        },
        tooltip: {
          backgroundColor: '#16213e', titleColor: '#fff', bodyColor: '#e0e0e0',
          borderColor: '#2a3a5c', borderWidth: 1,
        }
      }
    }
  });
}

function renderDetailTable(data) {
  const tbody = document.getElementById('detailBody');
  const ds = data.dimensionScores || {};
  const metrics = data.metrics || {};
  let rows = '';
  for (const key of DIM_KEYS) {
    const dimMetrics = metrics[key] || {};
    const indicators = INDICATORS[key] || [];
    const dimScore = ds[key]?.score;
    const grade = gradeInfo(dimScore ?? 0);
    for (const ind of indicators) {
      const val = dimMetrics[ind.key];
      const displayVal = ind.fmt(val);
      let statusHtml = '';
      if (ind.benchmark != null && val != null && val !== true && val !== false && val >= 0) {
        // For metrics where lower is better
        const lowerBetter = ['eslintErrorDensity', 'eslintWarningDensity', 'innerHTMLCount',
          'evalCount', 'auditTotal', 'auditHigh', 'bundleSizeKB', 'jsBundleSizeKB',
          'testsFailed', 'functionAvgLines'].includes(ind.key);
        const met = lowerBetter ? val <= ind.benchmark : val >= ind.benchmark;
        const color = met ? '#4caf50' : '#f44336';
        const label = met ? '达标' : '未达标';
        statusHtml = `<span style="color:${color}"><span class="status-dot" style="background:${color}"></span>${label}</span>`;
      } else if (ind.benchmark === true || ind.benchmark === false) {
        const met = val === ind.benchmark;
        const color = met ? '#4caf50' : '#f44336';
        statusHtml = `<span style="color:${color}"><span class="status-dot" style="background:${color}"></span>${met ? '达标' : '未达标'}</span>`;
      } else {
        statusHtml = '<span style="color:var(--text-dim)">—</span>';
      }
      const benchDisplay = ind.benchmark != null ? (typeof ind.benchmark === 'boolean' ? (ind.benchmark ? '是' : '否') : ind.benchmark + (ind.unit || '')) : '—';
      rows += `<tr>
        <td>${DIM_META[key].name}</td>
        <td>${ind.name}</td>
        <td>${displayVal}</td>
        <td>${benchDisplay}</td>
        <td style="color:${grade.color}">${dimScore != null ? dimScore.toFixed(1) : '--'}</td>
        <td>${statusHtml}</td>
      </tr>`;
    }
  }
  tbody.innerHTML = rows || '<tr><td colspan="6" style="text-align:center;color:var(--text-dim);padding:24px">暂无指标数据</td></tr>';
}

function showEmptyDashboard() {
  document.getElementById('timestamp').textContent = '--';
  document.getElementById('scoreOverview').innerHTML = `
    <div class="empty-state" style="padding:24px">
      <div class="icon">📊</div>
      <p>暂无数据</p>
      <div class="hint">请先运行质量评估脚本生成 reports/quality-score.json</div>
    </div>
  `;
  document.getElementById('dimCards').innerHTML = '';
  document.getElementById('gateChecks').innerHTML = '';
  document.getElementById('findingsList').innerHTML = '<div class="empty-state"><p>暂无发现</p></div>';
  document.getElementById('detailBody').innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-dim);padding:24px">暂无数据</td></tr>';
  // Empty charts with placeholder
  ['radarChart', 'trendChart', 'pieChart'].forEach(id => {
    const canvas = document.getElementById(id);
    canvas.style.display = 'none';
  });
}

// ===== Main =====
async function main() {
  const data = await fetchJSON(SCORE_URL);
  if (!data) {
    showEmptyDashboard();
    return;
  }
  const history = await fetchHistory();
  const prevData = history.length > 0 ? history[history.length - 1] : null;

  renderHeader(data);
  renderScoreOverview(data);
  renderGateChecks(data);
  renderDimCards(data, prevData);
  renderRadar(data);
  renderTrend(history, data);
  renderFindings(data);
  renderPie(data);
  renderDetailTable(data);
}

main();
</script>
</body>
</html>
